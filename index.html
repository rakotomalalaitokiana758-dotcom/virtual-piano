<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Piano Virtuel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Virtual Piano</h1>

    <div class="piano">

        <div class="white-key">Do</div>
        <div class="white-key">Ré</div>
        <div class="white-key">Mi</div>
        <div class="white-key">Fa</div>
        <div class="white-key">Sol</div>
        <div class="white-key">La</div>
        <div class="white-key">Si</div>

        <div class="black-key do-diese"></div>
        <div class="black-key re-diese"></div>
        <div class="black-key fa-diese"></div>
        <div class="black-key sol-diese"></div>
        <div class="black-key la-diese"></div>

    </div>

</body>
</html>
